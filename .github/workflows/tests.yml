name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:  # started by the Dependencies workflow on its own pull requests

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: connector
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.13.5"
      - name: Test the connector
        run: uv run --frozen --group dev --python 3.12 pytest -q
      - name: Test the project-plugin template
        working-directory: templates/project-plugin/server
        run: uv run --frozen --group dev --python 3.12 pytest -q
