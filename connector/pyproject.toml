[project]
name = "eunomai-business"
version = "0.1.0"
description = "Local connector of eunomai-business: sign-in, workspaces, versions and save points for business users in Claude Cowork."
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "httpx==0.28.1",
    "truststore==0.10.4",
    "dulwich==1.2.17",
    "urllib3==2.8.0",
    "keyring==25.7.0; sys_platform != 'win32'",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[project.scripts]
eunomai-business = "eunomai_business.server:main"
eunomai-business-hook = "eunomai_business.hook:main"
eunomai-business-guard = "eunomai_business.guard:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eunomai_business"]

[tool.uv]
# The whole dependency tree follows the same rule as dependency_check: nothing younger than two weeks.
exclude-newer = "14 days"
# ...unless every older version is vulnerable: then the fixed one wins. tools/update_dependencies.py maintains
# these overrides from dependency_check, and drops them once the two-week window covers them.
exclude-newer-package = { certifi = "2026-10-21T00:00:00Z" }
# Rebuild when the source changes, not only when pyproject.toml does (uv caches local builds).
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A deprecated call breaks the tests now rather than the connector after an upgrade.
filterwarnings = ["error::DeprecationWarning"]
